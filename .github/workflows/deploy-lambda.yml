name: Deploy to AWS Lambda

# Runs only when the repository variable LAMBDA_FUNCTION_NAME is set (Settings > Secrets and variables > Actions > Variables).
# Needs secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY for an IAM user allowed to call lambda:UpdateFunctionCode.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-lambda

jobs:
  deploy:
    if: ${{ vars.LAMBDA_FUNCTION_NAME != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build server and MCP App view
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run build:apps
      - name: Package (production dependencies only)
        run: |
          npm prune --omit=dev
          zip -qr function.zip dist node_modules apps/dist package.json
          ls -lh function.zip
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      - name: Update function code
        run: |
          aws lambda update-function-code --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" --zip-file fileb://function.zip --publish
          aws lambda wait function-updated --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"
